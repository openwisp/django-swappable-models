[tox]
envlist =
    py{311,312,313}-django52-{noswap, swap}
    py{312,313}-django{60,61}-{noswap, swap}
    lint

[gh-actions]
python =
    3.11: py311, lint
    3.12: py312, lint
    3.13: py313, lint

[testenv]
commands =
    rm -rf tests/default_app/migrations/ tests/alt_app/migrations/
    python -m unittest discover -s tests
deps =
    django52: django~=5.2.0
    django60: django~=6.0.0
    django61: django~=6.1.0
setenv =
    noswap: DJANGO_SETTINGS_MODULE=tests.settings
    swap: DJANGO_SETTINGS_MODULE=tests.swap_settings
allowlist_externals = rm

[testenv:lint]
commands =
    rm -rf tests/default_app/migrations/ tests/alt_app/migrations/
    flake8 swapper tests
allowlist_externals =
    rm
    flake8
